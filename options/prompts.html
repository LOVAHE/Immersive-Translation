<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title data-i18n="promptEditor">Prompt Editor</title>
  <link rel="stylesheet" href="tailwind-pretty.min.css">
</head>
<body class="bg-slate-50 text-slate-900">
<main class="mx-auto max-w-4xl px-6 py-6 space-y-6">
  <h1 class="text-xl font-semibold" data-i18n="promptEditor">Prompt Editor</h1>

  <section class="rounded-xl border border-slate-200/70 bg-white p-4 space-y-3">
    <h2 class="text-base font-semibold" data-i18n="promptTranslate">Translate Prompt</h2>
    <label class="block text-sm font-medium" data-i18n="promptSystem">System</label>
    <textarea id="openaiPromptTranslateSystem" rows="5" class="w-full rounded-lg border-slate-300 px-3 py-2"></textarea>
    <label class="block text-sm font-medium" data-i18n="promptUser">User</label>
    <textarea id="openaiPromptTranslateUser" rows="5" class="w-full rounded-lg border-slate-300 px-3 py-2"></textarea>
  </section>

  <section class="rounded-xl border border-slate-200/70 bg-white p-4 space-y-3">
    <h2 class="text-base font-semibold" data-i18n="promptDict">Dictionary Prompt</h2>
    <label class="block text-sm font-medium" data-i18n="promptSystem">System</label>
    <textarea id="openaiPromptDictSystem" rows="8" class="w-full rounded-lg border-slate-300 px-3 py-2"></textarea>
    <label class="block text-sm font-medium" data-i18n="promptUser">User</label>
    <textarea id="openaiPromptDictUser" rows="3" class="w-full rounded-lg border-slate-300 px-3 py-2"></textarea>
  </section>

  <div class="flex justify-end gap-3">
    <button id="btnReset" class="btn btn-ghost" data-i18n="btnReset">Reset</button>
    <button id="btnSave" class="btn btn-primary" data-i18n="btnSave">Save</button>
  </div>
</main>
<script type="module" src="prompts.js"></script>
</body>
</html>
