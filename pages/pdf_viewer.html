<!doctype html>
<meta charset="utf-8">
<title>PDF Translator</title>
<style>
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Noto Sans, sans-serif; background:#111; color:#eee; }
  #c { position:relative; width:100vw; height:100vh; overflow:auto; }
  .page { position:relative; margin: 12px auto; background:#333; }
  .block { 
    position:absolute; 
    z-index: 10;
    pointer-events: auto;
  }
  .block:hover { z-index: 20; }
  .tl-bubble { 
    background: #fff; 
    color: #0f172a; 
    padding: 6px 12px; 
    border-radius: 8px; 
    font: 14px/1.5 system-ui, -apple-system, sans-serif; 
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    border: 1px solid rgba(0,0,0,0.08);
    display: inline-block;
  }
</style>
<div id="c"></div>
<script type="module" src="pdf_viewer.js"></script>
