<!doctype html>
<meta charset="utf-8">
<title>PDF Translator</title>
<style>
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Noto Sans, sans-serif; background:#111; color:#eee; }
  #c { position:relative; width:100vw; height:100vh; overflow:auto; }
  .page { position:relative; margin: 12px auto; background:#333; }
  .layer { position:absolute; left:0; top:0; pointer-events:none; }
  .block { position:absolute; background: rgba(0,0,0,.45); color:#fff; padding:2px 4px; border-radius:4px; font:14px/1.25 system-ui; text-shadow:0 1px 2px rgba(0,0,0,.5); }
  .row { display:block; }
  .tl { color:#b7e3ff; }
</style>
<div id="c"></div>
<script type="module" src="pdf_viewer.js"></script>
